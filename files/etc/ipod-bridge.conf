# Settings for ipod-bridge. After a change run: systemctl restart ipod-bridge

# The name that the stereo gets from "RequestiPodName". Empty: the phone's Bluetooth name.
IPOD_NAME=

# The Bluetooth name of the Pi, as the phone shows it.
IPOD_BT_NAME=Pi iPod

# The iPod passes the stereo's authentication when no signature comes in this time.
# The stereo's MFi chip needed about 56 s in the car.
IPOD_AUTH_TIMEOUT=70s

# The Pi connects to the paired phones by itself, as a car kit does, every this many seconds
# (3 times slower after a minute without success). 0 switches it off.
IPOD_RECONNECT_EVERY=10s

# The pairing window (10 minutes) opens by itself when no phone is connected this long after start,
# so that a new phone can pair without SSH. 0 switches it off.
IPOD_PAIR_AFTER=60s

# When the stereo sends USB frames this long but no request, the Pi disconnects from the bus and connects
# again (up to 3 times). The stereo does that when the Pi was on the bus before the stereo's USB started.
# 0 switches it off.
IPOD_USB_REPLUG_AFTER=3s

# The phone's audio goes to the stereo this many dB lower. The stereo clips loud songs at the full
# digital level. 0 sends it unchanged. After a change run: systemctl restart ipod-audio
IPOD_AUDIO_GAIN_DB=-6

# The Pi holds the phone's audio this long before the stereo gets it (bluealsa-aplay's buffer). ipod-bridge reports
# this delay (plus the measured rest of the pipeline) to the phone, so that its video waits for the sound.
# After a change run: systemctl restart ipod-audio ipod-bridge
IPOD_AUDIO_LATENCY_MS=500

# The stereo's own delay (USB in to speaker out), added to the reported delay. Not measured: 0.
IPOD_EXTRA_DELAY_MS=0

# IPOD_DELAY_REPORT=0           # do not report the delay to the phone
# IPOD_DEBUG=1
# IPOD_TRACE_HID=0
